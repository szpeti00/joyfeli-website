      # 7. Terms and Conditions
      - file: "src/en/terms-and-conditions.md"
        label: "Terms & Conditions"
        name: "terms_en"
        fields: &legal_fields
          - {label: "Layout", name: "layout", widget: "hidden"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Locale", name: "locale", widget: "hidden"}
          - {label: "Page Key", name: "pageKey", widget: "hidden"}
          - {label: "Date", name: "date", widget: "datetime", required: false}
          - {label: "Display Title", name: "title_display", widget: "string"}
          - {label: "Last Updated Text", name: "last_updated", widget: "string", required: false}
          - {label: "PDF Link", name: "pdf_link", widget: "file"}
          - {label: "Button Text", name: "button_text", widget: "string"}
          - {label: "Button Label", name: "button_label", widget: "string"}
          - label: "Sections"
            name: "sections"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Content", name: "content", widget: "markdown"}

      # 8. Privacy Policy
      - file: "src/en/privacy-policy.md"
        label: "Privacy Policy"
        name: "privacy_en"
        fields: *legal_fields

  # ==========================================
  # DUTCH PAGES
  # ==========================================
  - name: "dutch_pages"
    label: "Dutch Pages"
    files:
      - file: "src/index.md"
        label: "Home"
        name: "home_nl"
        fields: *home_fields

      - file: "src/personal-training-nl.md"
        label: "Personal Training"
        name: "personal_training_nl"
        fields: *coaching_fields

      - file: "src/leefstijlcoaching.md"
        label: "Leefstijlcoaching"
        name: "lifestyle_coaching_nl"
        fields: *coaching_fields

      - file: "src/voor-haar.md"
        label: "Voor Haar"
        name: "for_her_nl"
        fields: *coaching_fields

      - file: "src/over.md"
        label: "Over mij"
        name: "about_nl"
        fields: *about_fields

      - file: "src/contact_2.md"
        label: "Contact"
        name: "contact_nl"
        fields: *contact_fields

      - file: "src/algemene-voorwaarden.md"
        label: "Algemene Voorwaarden"
