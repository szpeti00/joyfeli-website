# --- BACKEND SETTINGS ---

# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: szpeti00/joyfeli-website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/e5b76646-a4c0-45b6-83bf-ae138c8ad601/pkce
  auth_token_endpoint: /sites/e5b76646-a4c0-45b6-83bf-ae138c8ad601/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://joyfelicoaching.nl


# --- CONTENT STRUCTURE ---
media_folder: "src/img" 
public_folder: "/img"

collections:
  # ==========================================
  # ENGLISH PAGES
  # ==========================================
  - name: "english_pages"
    label: "English Pages"
    files:
      # 1. Home Page
      - file: "src/en/index.md"
        label: "Home"
        name: "home_en"
        fields: &home_fields
          - {label: "Layout", name: "layout", widget: "hidden"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Locale", name: "locale", widget: "hidden"}
          - {label: "Page Key", name: "pageKey", widget: "hidden"}
          - {label: "Navbar Class", name: "navbarClass", widget: "hidden", required: false}
          - {label: "Hero Image", name: "heroImage", widget: "image"}
          - label: "Hero Quote"
            name: "quote"
            widget: "object"
            fields:
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Author", name: "author", widget: "string"}
          - label: "Welcome Section"
            name: "welcome"
            widget: "object"
            fields:
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Title Part 1", name: "title_part1", widget: "string"}
              - {label: "Title Part 2", name: "title_part2", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Text", name: "text", widget: "markdown"}
          - label: "Coaching Services"
            name: "services"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - label: "Cards"
                name: "cards"
                widget: "list"
                fields:
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Subtitle", name: "subtitle", widget: "string"}
                  - {label: "Text", name: "text", widget: "text"}
                  - {label: "Button Text", name: "button_text", widget: "string"}
                  - {label: "Link Key", name: "link_key", widget: "string"}
          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Button Text", name: "button_text", widget: "string"}
              - {label: "Link Key", name: "link_key", widget: "string"}
              - {label: "Text", name: "text", widget: "markdown"}
          - label: "Reviews Section"
            name: "reviews"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - label: "Review Items"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Quote", name: "quote", widget: "text"}
                  - {label: "Author", name: "author", widget: "string"}
          - label: "Contact Section"
            name: "contact_section"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
          - label: "Form Settings"
            name: "form_section"
            widget: "object"
            fields:
              - {label: "Submit Button", name: "button", widget: "string"}
              - label: "Labels"
                name: "labels"
                widget: "object"
                fields:
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Email", name: "email", widget: "string"}
                  - {label: "Phone", name: "phone", widget: "string"}
                  - {label: "Message", name: "message", widget: "string"}
              - label: "Placeholders"
                name: "placeholders"
                widget: "object"
                fields:
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Email", name: "email", widget: "string"}
                  - {label: "Phone", name: "phone", widget: "string"}
                  - {label: "Message", name: "message", widget: "string"}

      # 2. Personal Training
      - file: "src/en/personal-training.md"
        label: "Personal Training"
        name: "personal_training_en"
        fields: &coaching_fields
          - {label: "Layout", name: "layout", widget: "hidden"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Locale", name: "locale", widget: "hidden"}
          - {label: "Page Key", name: "pageKey", widget: "hidden"}
          - {label: "Hero Image", name: "heroImage", widget: "image"}
          - label: "Tabs Navigation"
            name: "tabs"
            widget: "object"
            fields:
              - {label: "Tab 1 Name", name: "ptraining", widget: "string"}
              - {label: "Tab 2 Name", name: "info", widget: "string"}
              - {label: "Tab 3 Name", name: "pricing", widget: "string"}
          - label: "Hero Content"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
          - label: "Tab 1: Intro Texts"
            name: "tab_intro"
            widget: "object"
            fields:
              - {label: "Section 1 Title", name: "section1_title", widget: "string"}
              - {label: "Section 1 Subtitle", name: "section1_subtitle", widget: "string"}
              - {label: "Section 1 Text", name: "section1_text", widget: "markdown"}
              - {label: "Section 2 Title", name: "section2_title", widget: "string"}
              - {label: "Section 2 Subtitle", name: "section2_subtitle", widget: "string"}
              - {label: "Section 2 Text", name: "section2_text", widget: "markdown"}
          - label: "Tab 2: Practical Info"
            name: "tab_info"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Intro Text", name: "intro_text", widget: "markdown"}
              - label: "Process Steps"
                name: "steps"
                widget: "list"
                fields:
                  - {label: "ID (No spaces)", name: "id", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Icon Name", name: "main_icon", widget: "string"}
                  - {label: "Description", name: "description", widget: "markdown"}
                  - label: "Features List"
                    name: "features"
                    widget: "list"
                    fields:
                      - {label: "Icon Name", name: "icon", widget: "string"}
                      - {label: "Text", name: "text", widget: "string"}
          - label: "Tab 3: Pricing"
            name: "tab_pricing"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Intro Text", name: "intro_text", widget: "markdown", required: false}
              - label: "Pricing Packages"
                name: "packages"
                widget: "list"
                fields:
                  - {label: "ID (No spaces)", name: "id", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Duration", name: "duration", widget: "string"}
                  - {label: "Solo Price", name: "price_solo", widget: "string"}
                  - {label: "Duo Price (Optional)", name: "price_duo", widget: "string", required: false}
                  - {label: "More Info Text", name: "more_info", widget: "markdown"}
                  - label: "Features"
                    name: "features"
                    widget: "list"
                    field: {label: "Feature Text", name: "feature", widget: "string"}

      # 3. Lifestyle Coaching
      - file: "src/en/lifestyle-coaching.md"
        label: "Lifestyle Coaching"
        name: "lifestyle_coaching_en"
        fields: *coaching_fields

      # 4. For Her
      - file: "src/en/for-her.md"
        label: "For Her"
        name: "for_her_en"
        fields: *coaching_fields

      # 5. About
      - file: "src/en/about.md"
        label: "About Me"
        name: "about_en"
        fields: &about_fields
          - {label: "Layout", name: "layout", widget: "hidden"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Locale", name: "locale", widget: "hidden"}
          - {label: "Page Key", name: "pageKey", widget: "hidden"}
          - {label: "Hero Image", name: "heroImage", widget: "image"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
          - label: "Tabs Navigation"
            name: "tabs"
            widget: "object"
            fields:
              - {label: "Tab 1 Name", name: "about", widget: "string"}
              - {label: "Tab 2 Name", name: "studies", widget: "string"}
              - {label: "Tab 3 Name", name: "work", widget: "string"}
          - label: "Tab 1: About Me"
            name: "tab_about"
            widget: "object"
            fields:
              - {label: "Greeting", name: "greeting", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Top Text", name: "top_text", widget: "markdown"}
              - {label: "Profile Image", name: "profile_image", widget: "image"}
              - {label: "Bottom Text", name: "bottom_text", widget: "markdown"}
              - {label: "Kayak Image", name: "kayak_image", widget: "image"}
          - label: "Tab 2: Studies"
            name: "tab_studies"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Intro Text", name: "intro_text", widget: "markdown"}
              - label: "Study Items"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Text", name: "text", widget: "markdown"}
                  - {label: "Icon Name", name: "icon", widget: "string"}
          - label: "Tab 3: Work Experience"
            name: "tab_work"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Intro Text", name: "intro_text", widget: "markdown"}
              - label: "Work Items"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Text", name: "text", widget: "markdown"}
                  - {label: "Icon Name", name: "icon", widget: "string"}

      # 6. Contact
      - file: "src/en/contact.md"
        label: "Contact"
        name: "contact_en"
        fields: &contact_fields
          - {label: "Layout", name: "layout", widget: "hidden"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Locale", name: "locale", widget: "hidden"}
          - {label: "Page Key", name: "pageKey", widget: "hidden"}
          - {label: "Hero Image", name: "heroImage", widget: "image"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
          - label: "Contact Info"
            name: "contact_info"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "markdown"}
          - label: "Form Settings"
            name: "form_section"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Submit Button", name: "button", widget: "string"}
              - label: "Labels"
                name: "labels"
                widget: "object"
                fields:
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Email", name: "email", widget: "string"}
                  - {label: "Phone", name: "phone", widget: "string"}
                  - {label: "Message", name: "message", widget: "string"}
              - label: "Placeholders"
                name: "placeholders"
                widget: "object"
                fields:
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Email", name: "email", widget: "string"}
                  - {label: "Phone", name: "phone", widget: "string"}
